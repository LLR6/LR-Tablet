name: Release Debug APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "tag ${TAG} does not match package.json version ${ACTUAL}"
            exit 1
          fi
          echo "APP_VERSION=${ACTUAL}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Validate data and backup compatibility
        run: |
          npm run validate:data
          npm run test:backup

      - name: Build web application
        run: npm run build

      - name: Build Android debug APK
        run: |
          npx cap add android
          npx cap sync android
          node scripts/configure-android.mjs
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare release artifacts
        shell: bash
        run: |
          APK="LR-KaoYan-English-v${APP_VERSION}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${APK}"
          SHA="$(sha256sum "${APK}" | awk '{print $1}')"
          echo "${SHA}  ${APK}" > SHA256SUMS.txt
          cat > build-metadata.json <<EOF
          {
            "schema": "lr-tablet-build/v1",
            "version": "${APP_VERSION}",
            "commit": "${GITHUB_SHA}",
            "tag": "${GITHUB_REF_NAME}",
            "artifact": "${APK}",
            "sha256": "${SHA}",
            "build_type": "debug"
          }
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}"             "LR-KaoYan-English-v${APP_VERSION}-debug.apk"             SHA256SUMS.txt             build-metadata.json             --verify-tag             --generate-notes             --title "LR-Tablet ${GITHUB_REF_NAME} (debug APK)"
