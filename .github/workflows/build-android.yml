name: Build LR Pindou APK
on:
  workflow_dispatch:
  push:
    branches: [lr-pindou]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk LR-Pindou-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LR-Pindou-APK
          path: LR-Pindou-v1.0.apk
          retention-days: 30
