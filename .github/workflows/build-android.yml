name: Build LR English Reading APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Check release metadata consistency
        run: npm run check:release

      - name: Validate built-in question bank
        run: npm run validate:data

      - name: Test backup integrity
        run: npm run test:backup

      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/data.js
          node --check src/backup.js
          node --check scripts/validate-question-bank.mjs
          node --check scripts/configure-android.mjs

      - name: Build web application
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply tablet configuration
        run: node scripts/configure-android.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          APP_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk "LR-KaoYan-English-v${APP_VERSION}.apk"

      - name: Generate APK provenance
        shell: bash
        run: |
          APK_SHA256="$(sha256sum "LR-KaoYan-English-v${APP_VERSION}.apk" | awk '{print $1}')"
          echo "${APK_SHA256}  LR-KaoYan-English-v${APP_VERSION}.apk" > "LR-KaoYan-English-v${APP_VERSION}.apk.sha256"
          cat > build-metadata.json <<EOF
          {
            "schema": "lr-tablet-build/v1",
            "app_version": "${APP_VERSION}",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "artifact": "LR-KaoYan-English-v${APP_VERSION}.apk",
            "sha256": "${APK_SHA256}"
          }
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LR-English-Reading-APK
          path: |
            LR-KaoYan-English-v${{ env.APP_VERSION }}.apk
            LR-KaoYan-English-v${{ env.APP_VERSION }}.apk.sha256
            build-metadata.json
          if-no-files-found: error
          retention-days: 30
