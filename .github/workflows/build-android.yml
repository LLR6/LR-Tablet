name: Build LR Pindou APK

on:
  workflow_dispatch:
  push:
    branches: [lr-pindou]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure LR Pindou Android app
        run: node scripts/configure-android.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LR-Pindou-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LR-Pindou-APK
          path: LR-Pindou-v1.0.apk
          if-no-files-found: error
          retention-days: 30
