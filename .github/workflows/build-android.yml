name: Build LR English Reading APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Validate built-in question bank
        run: npm run validate:data

      - name: Test backup integrity
        run: npm run test:backup

      - name: Build web application
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply tablet configuration
        run: node scripts/configure-android.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LR-KaoYan-English-v1.0.apk

      - name: Generate APK provenance
        shell: bash
        run: |
          sha256sum LR-KaoYan-English-v1.0.apk > LR-KaoYan-English-v1.0.apk.sha256
          cat > build-metadata.json <<EOF
          {
            "schema": "lr-tablet-build/v1",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "artifact": "LR-KaoYan-English-v1.0.apk"
          }
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: LR-English-Reading-APK
          path: |
            LR-KaoYan-English-v1.0.apk
            LR-KaoYan-English-v1.0.apk.sha256
            build-metadata.json
          if-no-files-found: error
          retention-days: 30
