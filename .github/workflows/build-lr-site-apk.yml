name: Build LR Site Access APK

on:
  workflow_dispatch:
  push:
    branches:
      - lr-site-access
    paths:
      - ".lrpayload/**"
      - ".github/workflows/build-lr-site-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore LR Site Access source
        shell: bash
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties README-LR-SITE.md
          cat .lrpayload/part01.txt .lrpayload/part02.txt .lrpayload/part03.txt .lrpayload/part04.txt > /tmp/lr-site.b64
          base64 -d /tmp/lr-site.b64 > /tmp/lr-site.zip
          unzip -o /tmp/lr-site.zip -d .
          test -f app/src/main/java/com/lr/siteaccess/MainActivity.java
          test -f app/src/main/java/com/lr/siteaccess/HistoryActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LR-Site-Access-HONOR90Pro-v1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LR-Site-Access-HONOR90Pro-v1.2
          path: LR-Site-Access-HONOR90Pro-v1.2.apk
          if-no-files-found: error
          retention-days: 30
