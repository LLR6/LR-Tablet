name: Build LR Site Access APK

on:
  workflow_dispatch:
  push:
    branches:
      - lr-site-access

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore LR Site Access source
        shell: bash
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties README-LR-SITE.md
          cat > /tmp/lr-site.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/lr-site.b64 > /tmp/lr-site.zip
          unzip -o /tmp/lr-site.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LR-Site-Access-v1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LR-Site-Access-APK-v1.1
          path: LR-Site-Access-v1.1.apk
          if-no-files-found: error
          retention-days: 30
